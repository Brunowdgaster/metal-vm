name: ci

# O CI roda a MESMA suíte em 4 combinações de compilador/dispatch em C, mais
# as 2 variantes de pilha em Rust, mais a compatibilidade cruzada de bytecode.
# Não é excesso: o bug de ponto de sequência em PUSH (ver README > Decisões)
# só apareceu no gcc; o MSVC compilou calado. Dois compiladores independentes
# são duas revisões de código de graça.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  c-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc,   goto: 'OFF' }
          - { cc: gcc,   goto: 'ON'  }
          - { cc: clang, goto: 'OFF' }
          - { cc: clang, goto: 'ON'  }
    name: c ${{ matrix.cc }} goto=${{ matrix.goto }}
    steps:
      - uses: actions/checkout@v5
      - name: configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} -DFVM_USE_GOTO=${{ matrix.goto }}
      - name: compilar
        run: cmake --build build -j
      - name: testes
        run: bash tests/run_tests.sh build/fvm

  c-windows:
    runs-on: windows-latest
    name: c msvc switch
    steps:
      - uses: actions/checkout@v5
      - name: configurar e compilar
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: testes
        shell: pwsh
        run: ./tests/run_tests.ps1 -Exe ./build/Release/fvm.exe

  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ['', 'boxed-stack']
    name: rust stack=${{ matrix.features == '' && 'vec' || matrix.features }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: formatação
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: clippy (avisos são erro)
        run: cargo clippy --manifest-path rust/Cargo.toml --release --features "${{ matrix.features }}" -- -D warnings
      - name: testes unitários
        run: cargo test --manifest-path rust/Cargo.toml --release --features "${{ matrix.features }}"
      - name: suíte .fasm
        run: |
          cargo build --manifest-path rust/Cargo.toml --release --features "${{ matrix.features }}"
          bash tests/run_tests.sh rust/target/release/fvm

  # O teste que só existe porque há duas implementações: as duas têm de emitir
  # bytecode byte a byte idêntico e executar o arquivo uma da outra.
  # Os cinco portes do nucleo minimo. Um job so, porque as toolchains sao
  # independentes e o que importa e a verificacao conjunta: todos executando o
  # MESMO .fbc montado pelo C.
  #
  # Nao mede tempo aqui: a tabela de ports/mede.sh depende da maquina, e runner
  # compartilhado nao serve de linha de base -- este repositorio ja mediu 631 e
  # 411 Mops/s em dois runners identicos. O que o CI verifica e o que NAO
  # depende da maquina: saida byte a byte identica nos 9 casos.
  portes:
    runs-on: ubuntu-latest
    name: portes (Nim, Odin, D, V, Ada)
    steps:
      - uses: actions/checkout@v5

      - name: toolchains do apt
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # clang e dependencia do Odin: ele usa o clang como linker.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq             nim gnat ldc clang cmake
          nim --version | head -1
          gnatmake --version | head -1
          ldc2 --version | head -1

      - name: Odin (release do GitHub, MIT)
        run: |
          set -euo pipefail
          tag=dev-2026-11a
          curl -sSL -o odin.tar.gz             "https://github.com/odin-lang/Odin/releases/download/$tag/odin-linux-amd64-$tag.tar.gz"
          mkdir -p "$HOME/odin" && tar xzf odin.tar.gz -C "$HOME/odin"
          bin=$(find "$HOME/odin" -maxdepth 3 -type f -name odin | head -1)
          test -n "$bin" || { echo "binario do Odin nao encontrado no release"; exit 1; }
          chmod +x "$bin"
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
          "$bin" version

      - name: V (release do GitHub, MIT)
        run: |
          set -euo pipefail
          curl -sSL -o v.zip https://github.com/vlang/v/releases/latest/download/v_linux.zip
          mkdir -p "$HOME/vlang" && (cd "$HOME/vlang" && unzip -qo "$GITHUB_WORKSPACE/v.zip")
          vbin=$(find "$HOME/vlang" -maxdepth 3 -type f -name v | head -1)
          test -n "$vbin" || { echo "binario do V nao encontrado no release"; exit 1; }
          chmod +x "$vbin"
          echo "$(dirname "$vbin")" >> "$GITHUB_PATH"
          "$vbin" version

      - name: referencia em C
        run: bash build.sh

      - name: compila os cinco portes
        run: |
          set -euo pipefail
          (cd ports/nim  && nim c -d:release --hints:off --out:fvm_nim fvm.nim)
          (cd ports/odin && odin build fvm.odin -file -o:speed -out:fvm_odin)
          (cd ports/d    && ldc2 -O3 --release -of=fvm_d fvm.d)
          (cd ports/v    && v -prod -o fvm_v fvm.v)
          (cd ports/ada  && gnatmake -O2 -o fvm_ada fvm.adb)

      - name: 9 casos x 5 portes, saida byte a byte
        run: bash ports/verifica.sh

  cross-compat:
    runs-on: ubuntu-latest
    needs: [c-linux, rust]
    name: compatibilidade C <-> Rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: compilar as duas
        run: |
          bash build.sh switch
          cargo build --manifest-path rust/Cargo.toml --release
      - name: cross-compat
        run: bash tests/cross_compat.sh build-switch/fvm rust/target/release/fvm

  # Mede, mas NÃO falha o build por regressão de performance: a variância em
  # runner compartilhado é grande demais para servir de gate (ver docs/BENCH.md).
  bench:
    runs-on: ubuntu-latest
    needs: [c-linux, rust]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: compilar tudo
        run: |
          bash build.sh switch
          bash build.sh goto
          cargo build --manifest-path rust/Cargo.toml --release
          echo "--- binarios produzidos ---"
          ls -l build-switch/fvm build-goto/fvm rust/target/release/fvm
      - name: medir
        run: REPS=5 bash bench/run_bench.sh build-switch/fvm build-goto/fvm rust/target/release/fvm
      - name: identificar a maquina
        # A conclusao sobre dispatch depende do hardware (ver docs/BENCH.md):
        # sem saber em que CPU a medicao rodou, o numero nao serve de nada.
        run: |
          grep -m1 "model name" /proc/cpuinfo || true
          nproc
          gcc --version | head -1
          rustc --version
